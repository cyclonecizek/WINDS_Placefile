name: Update KSC WINDS Placefiles

on:
  workflow_dispatch:
  schedule:
    # Request an update every 5 minutes (UTC).
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ksc-winds-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log workflow start time
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Runner started (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Generate WINDS placefiles
        env:
          LOOKBACK_MINUTES: "60"
          STALE_MINUTES: "120"
          KSC_WINDS_RESULT_URL: ${{ secrets.KSC_WINDS_RESULT_URL }}
        run: python src/ksc_winds_placefile.py

      - name: Generate Barnes divergence/convergence contours
        env:
          BARNES_GRID_SPACING_M: "500"
          BARNES_LENGTH_KM: "10"
          BARNES_GAMMA: "0.30"
          BARNES_MAX_INFLUENCE_KM: "28"
          BARNES_NEAREST_STATION_KM: "12"
          BARNES_MIN_NEARBY_STATIONS: "3"
          BARNES_HULL_BUFFER_KM: "12"
        run: python src/ksc_winds_barnes_divergence.py

      - name: Generate 1-hour looping WINDS placefiles
        env:
          WINDS_LOOP_MINUTES: "60"
          WINDS_LOOP_FRAME_HOLD_MINUTES: "5"
          WINDS_LOOP_CARRY_FORWARD_MINUTES: "7"
          BARNES_GRID_SPACING_M: "500"
          BARNES_LENGTH_KM: "10"
          BARNES_GAMMA: "0.30"
          BARNES_MAX_INFLUENCE_KM: "28"
          BARNES_NEAREST_STATION_KM: "12"
          BARNES_MIN_NEARBY_STATIONS: "3"
          BARNES_HULL_BUFFER_KM: "12"
          LOOKBACK_MINUTES: "65"
          STALE_MINUTES: "120"
          KSC_WINDS_RESULT_URL: ${{ secrets.KSC_WINDS_RESULT_URL }}
        run: python src/ksc_winds_loop_placefiles.py

      - name: Commit updated WINDS output
        run: |
          git config user.name "ksc-winds-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            docs/ksc_winds_surface.txt \
            docs/ksc_winds_lowest.txt \
            docs/ksc_winds_54ft.txt \
            docs/ksc_winds_200plus.txt \
            docs/ksc_winds_54ft_barnes_divergence.txt \
            docs/ksc_winds_54ft_barnes_divergence.json \
            docs/ksc_winds_surface_loop_1hr.txt \
            docs/ksc_winds_lowest_loop_1hr.txt \
            docs/ksc_winds_54ft_loop_1hr.txt \
            docs/ksc_winds_200plus_loop_1hr.txt \
            docs/ksc_winds_54ft_barnes_divergence_loop_1hr.txt \
            docs/ksc_winds_loop_1hr.json \
            docs/ksc_winds.json

          if git diff --cached --quiet; then
            echo "No WINDS change"
            exit 0
          fi

          git commit -m "Update KSC WINDS observations"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
